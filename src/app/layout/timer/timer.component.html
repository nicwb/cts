<div class="session-timer" [ngClass]="{
       'timer-warning': timePercentage < 30 && timePercentage > 0,
       'timer-expired': isTokenExpired || timePercentage <= 0
     }">
  <div class="timer-circle">
    <svg viewBox="0 0 36 36" class="circular-chart">
      <!-- Background circle -->
      <path class="circle-bg" d="M18 2.0845
               a 15.9155 15.9155 0 0 1 0 31.831
               a 15.9155 15.9155 0 0 1 0 -31.831" />
      <!-- Progress circle -->
      <path class="circle" [attr.stroke-dasharray]="timePercentage + ', 100'" d="M18 2.0845
               a 15.9155 15.9155 0 0 1 0 31.831
               a 15.9155 15.9155 0 0 1 0 -31.831" />
    </svg>
    <!-- Timer text display -->
    <div class="timer-display">
      <span>{{minutes}}:{{seconds}}</span>
    </div>
  </div>
</div>
