<div class="timer-wrapper">
  <div class="timer-circle">
    <svg width="60" height="60" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />
      <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(33,150,243,0.8)" stroke-width="8" stroke-linecap="round"
        [attr.stroke-dasharray]="dashArray" [attr.stroke-dashoffset]="dashOffset" transform="rotate(-90 50 50)" />
    </svg>
    <div class="timer-text">
      <div class="timer-display">{{minutes}}:{{seconds}}</div>
    </div>
  </div>
</div>
