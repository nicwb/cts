<h2 class="bg-color text-xl"><b> Regular Pension Bill Generation</b></h2>

<div class="card py-4">
    <div class="row">
        <!-- Form section -->
        <form [formGroup]="billPrintForm">
            <div class="p-fluid p-formgrid grid">
                <div class="field col-12 md:col-4">
                    <div
                        class="formgroup-inline"
                        style="display: flex; align-items: center"
                    >
                        <label class="mr-3 text-lg" for="month">Month:</label>

                        <p-dropdown
                            [style]="{ width: '100%' }"
                            [options]="months"
                            formControlName="months"
                            placeholder="Select a Month"
                            [showClear]="true"
                        ></p-dropdown>
                    </div>
                </div>
                <div class="field col-12 md:col-4">
                    <div
                        class="formgroup-inline"
                        style="display: flex; align-items: center"
                    >
                        <label class="mr-3 text-lg" for="year">Year:</label>
                        <p-calendar
                            formControlName="year"
                            view="year"
                            dateFormat="yy"
                            [showIcon]="true"
                            (onSelect)="onYearSelect($event)"
                            [style]="{ width: '100%' }"
                        ></p-calendar>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Progress and PPO Count Display -->
    <div
        class="mt-4 px-4 text-center"
        *ngIf="isGenerating || ppoCount !== null"
    >
        <div
            class="flex h-16"
            style="display: flex; justify-content: center; align-items: center"
            *ngIf="isGenerating"
        >
            <p-progressBar [value]="progress" class="flex-1"></p-progressBar>
            <button
                pButton
                pRipple
                class="ml-2 shrink-0 h-full px-4 text-white p-button-danger"
                *ngIf="isGenerating"
                (click)="onCancel()"
            >
                Cancel
            </button>
        </div>

        <p class="mt-2">{{ progressMessage }}</p>
        <p *ngIf="ppoCount !== null" class="mt-2">
            PPOs Available: {{ ppoCount }}
        </p>
    </div>

    <!-- Detailed Error Message Display -->
    <div *ngIf="failedMessages.length > 0" class="mt-4 px-4">
        <div class="error-container">
            <div class="error-title">Failed PPOs</div>
            <ul
                class="error-list"
                style="
                    max-height: 200px;
                    overflow-y: scroll;
                    padding: 15px;
                    margin: 0;
                "
            >
                <li *ngFor="let message of failedMessages">
                    {{ message }}
                </li>
            </ul>
        </div>
    </div>
    <div
        style="
            border-bottom: 1px solid rgba(139, 167, 184, 0.514);
            margin: 20px 0;
        "
    ></div>

    <!-- Button Group -->
    <div
        class="flex flex-column mt-4 align-items-center justify-content-center"
    >
        <div class="flex flex-wrap gap-2 justify-content-center">
            <button
                pButton
                pRipple
                (click)="onFetchPPOBills()"
                type="button"
                class="p-button-raised p-button-info"
                [disabled]="isGenerating || !billPrintForm.valid"
            >
                Fetch Bills
            </button>

            <button
                pButton
                pRipple
                (click)="onGenerate()"
                type="button"
                class="p-button-raised p-button-info"
                id="generateButton"
                [disabled]="isGenerating || ppoCount === null"
            >
                Generate {{ ppoCount }} Bill{{
                    ppoCount && ppoCount > 1 ? "s" : ""
                }}
            </button>
            <button
                pButton
                pRipple
                (click)="onRefresh()"
                type="button"
                class="p-button-raised p-button-info"
                [disabled]="isGenerating"
            >
                <i class="pi pi-refresh mr-2"></i>Refresh
            </button>
            <button
                pButton
                pRipple
                type="button"
                label="Print"
                class="p-button-secondary px-4"
                (click)="billprint()"
            >
                <i class="pi pi-check mr-2"></i>
            </button>
        </div>
    </div>
</div>

<style>
    .error-container {
        border: 1px solid #f44336;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 20px;
    }

    .error-title {
        background-color: #f44336;
        color: white;
        padding: 10px;
        font-weight: bold;
    }

    .error-list {
        list-style-type: none;
        padding: 15px;
        margin: 0;
    }

    .error-list li {
        color: #f44336;
        margin-bottom: 5px;
    }

    .error-list li:last-child {
        margin-bottom: 0;
    }
</style>
