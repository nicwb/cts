name: Playwright Tests for Angular CI

on: [push, pull_request]

jobs:
  database:
    name: Setup Database
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout IFMS-CTS repository for branch selection
        uses: actions/checkout@v4
        with:
          repository: 'abusalam/IFMS-CTS'

      - name: Select Branch of IFMS-CTS repository
        id: selected-branch
        run: |
          if [[ -n $(git ls-remote --heads origin ${{ github.head.ref || github.ref }}) ]]; then
            echo "branch-name=${{ github.head.ref || github.ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch-name=pension-module" >> $GITHUB_OUTPUT
          fi

    outputs:
      branch-name: ${{ steps.selected-branch.outputs.branch-name }}

  build:
    name: Build Angular 14 Project
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - name: Check linting
        run: npm run lint
      - run: npm run build --if-present

  test:
    name: Run Playwright Tests
    needs: [build, database]
    runs-on: ubuntu-24.04
    steps:
      - name: Add hosts to /etc/hosts
        run: |
          sudo echo "127.0.0.1 api.docker.test" | sudo tee -a /etc/hosts
      - name: Clone & Setup BackendAPI
        run: |
          git clone https://github.com/abusalam/IFMS-CTS.git ~/ifms-cts
          cd ~/ifms-cts
          git submodule update --init --recursive
          echo "IFMS-CTS Branch: ${{ needs.database.outputs.branch-name }}"
          git pull origin ${{ needs.database.outputs.branch-name }}
          git show --oneline -s
          cp .env.docker .env
          cd dotnet/CTS-BE
          git fetch --all
          git branch
          git pull origin ${{ needs.database.outputs.branch-name }}
          echo "dotnet/CTS-BE Branch: ${{ needs.database.outputs.branch-name }}"
          git show --oneline -s
          cd ..
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.29.1/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose build dotnet --build-arg HOST_UID=$UID
          docker-compose up -d dotnet

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: cp .env.playwright .env
      - name: Install dependencies
        run: npm ci
      - name: Run Eslint Check
        run: npx eslint e2e
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Changed Playwright tests
        run: xvfb-run npx playwright test --only-changed=$GITHUB_BASE_REF --reporter=list --headed
        if: github.event_name == 'push'
      - name: Run Full Playwright tests suite
        run: xvfb-run npx playwright test --reporter=list --headed --fail-on-flaky-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
